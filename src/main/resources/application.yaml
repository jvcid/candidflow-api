spring:
  application:
    name: candidflow-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  application:
    name: CandidFlow API
    description: API REST para gerenciamento de vagas e candidaturas

candidflow:
  security:
    hmac:
      enabled: ${HMAC_ENABLED:true}
      api-key: ${HMAC_API_KEY:}
      secret: ${HMAC_SECRET:}
      max-clock-skew-seconds: ${HMAC_MAX_CLOCK_SKEW_SECONDS:300}
